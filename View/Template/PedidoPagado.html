<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pago confirmado - Lifty</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:Arial, Helvetica, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:30px 0;">
        <tr>
            <td align="center">
                <table width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; padding:40px;">
                    <tr>
                        <td align="center" style="font-size:28px; font-weight:bold; color:#212529; padding-bottom:20px;">Lifty</td>
                    </tr>
                    <tr>
                        <td style="font-size:16px; color:#212529; padding-bottom:15px;">Hola {{Nombre}},</td>
                    </tr>
                    <tr>
                        <td style="font-size:14px; color:#495057; padding-bottom:20px;">Recibimos el pago de tu pedido. Lo preparamos y te avisaremos cuando salga a su destino. Puedes ver el detalle en la sección Mis pedidos.</td>
                    </tr>
                    <tr>
                        <td align="center" style="padding-bottom:20px;">
                            <span style="display:inline-block; font-size:18px; font-weight:bold; color:#212529; background-color:#f1f3f5; border-radius:6px; padding:12px 24px;">Pedido #{{Pedido}} &middot; {{Total}}</span>
                        </td>
                    </tr>
</table>
            </td>
        </tr>
    </table>
</body>
</html>
