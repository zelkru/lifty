# Solo para desarrollo con Docker. En XAMPP basta con copiar la carpeta del proyecto a
# htdocs (como "lifty") e importar lifty_bd.sql: no se necesita este archivo ni el .env.
#
# Se conecta al contenedor MySQL que ya exista en la maquina (red "mysql_default").
# Uso, desde esta carpeta:  cp .env.example .env  y luego  docker compose up -d
services:
  web:
    build: .
    container_name: lifty-web
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/html/lifty
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-lifty}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-lifty_bd}
    networks:
      - mysql_default

networks:
  mysql_default:
    external: true
